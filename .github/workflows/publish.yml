name: Publish plugin feed

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'reserved-ids.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Package plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in plugins/*/; do
            id="$(basename "$dir")"
            if [[ "$id" == .* || "$id" == _* ]]; then
              continue
            fi
            if [[ ! -f "plugins/$id/plugin.json" ]]; then
              continue
            fi
            version="$(node -p "require('./plugins/$id/plugin.json').version")"
            (cd plugins && zip -qr "../dist/${id}-${version}.clihub-plugin.zip" "$id")
          done

      - name: Validate descriptors and immutability
        run: node scripts/build-index.mjs --check

      - name: Publish new releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for zip in dist/*.clihub-plugin.zip; do
            tag="$(basename "$zip" .clihub-plugin.zip)"
            if gh release view "$tag" >/dev/null 2>&1; then
              if node -e "const i=require('./index.json'); process.exit((i.plugins||[]).some(p=>p.id+'-'+p.version===process.argv[1])?0:1)" "$tag"; then
                echo "Release $tag already published; leaving it unchanged."
                continue
              fi
              echo "Release $tag exists but index.json has no matching entry; reconcile manually." >&2
              exit 1
            fi
            gh release create "$tag" "$zip" --title "$tag" --notes "Plugin package $tag"
          done

      - name: Build index
        run: node scripts/build-index.mjs

      - name: Commit index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "No index changes."
            exit 0
          fi
          git commit -m "chore: update plugin index [skip ci]"
          git push
