name: Validate plugin feed

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'reserved-ids.json'
      - 'index.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Reject manual index edits and warn on protected paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"

          if grep -qx 'index.json' <<<"$changed"; then
            echo "::error::index.json is generated by CI; do not edit it in a pull request."
            exit 1
          fi

          if grep -Eq '^(scripts/|\.github/|reserved-ids\.json)' <<<"$changed"; then
            echo "::warning::Protected paths changed; maintainer review is required."
          fi

      - name: Package plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in plugins/*/; do
            id="$(basename "$dir")"
            if [[ "$id" == .* || "$id" == _* ]]; then
              continue
            fi
            if [[ ! -f "plugins/$id/plugin.json" ]]; then
              continue
            fi
            version="$(node -p "require('./plugins/$id/plugin.json').version")"
            (cd plugins && zip -qr "../dist/${id}-${version}.clihub-plugin.zip" "$id")
          done

      - name: Validate descriptors and packages
        run: node scripts/validate-plugin.mjs

      - name: Check index immutability
        run: node scripts/build-index.mjs --check
